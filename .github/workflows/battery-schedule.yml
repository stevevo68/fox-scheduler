name: Fox ESS Battery Automation

on:
  schedule:
    # 10:00 PM AEDT (11:00 UTC) -> Turn OFF
    - cron: '0 11 * * *'
    # 10:00 AM AEDT (23:00 UTC) -> Turn ON
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run (on/off)'
        required: true
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install foxesscloud requests matplotlib

      - name: Determine and Run Action
        env:
          FOX_API_KEY: ${{ secrets.FOX_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scheduler.py ${{ github.event.inputs.action }}
          else
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" -ge 22 ] || [ "$CURRENT_HOUR" -le 1 ]; then
              python scheduler.py on
            elif [ "$CURRENT_HOUR" -ge 10 ] && [ "$CURRENT_HOUR" -le 13 ]; then
              python scheduler.py off
            else
              python scheduler.py on
            fi
          fi
