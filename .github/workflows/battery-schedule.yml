name: Fox ESS Mode Scheduler Toggle

on:
  schedule:
    # 10:00 AM Sydney (covers both AEST & AEDT)
    - cron: '0 23 * * *'   # 23:00 UTC = 10 AM AEDT
    - cron: '0 0 * * *'    # 00:00 UTC = 10 AM AEST

    # 2:00 PM Sydney (covers both AEST & AEDT)
    - cron: '0 3 * * *'    # 03:00 UTC = 2 PM AEDT
    - cron: '0 4 * * *'    # 04:00 UTC = 2 PM AEST

  workflow_dispatch:
    inputs:
      action:
        description: 'Force action'
        required: true
        type: choice
        options:
          - off
          - on

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install foxesscloud requests matplotlib

      - name: Run
        env:
          FOX_API_KEY: ${{ secrets.FOX_API_KEY }}
          FOX_DEVICE_SN: ${{ secrets.FOX_DEVICE_SN }}
        run: |
          if [ -n "${{ github.event.inputs.action }}" ]; then
            python scheduler.py ${{ github.event.inputs.action }}
          else
            python scheduler.py
          fi
