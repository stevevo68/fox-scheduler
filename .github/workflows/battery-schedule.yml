name: Fox ESS Mode Scheduler Toggle

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'off'
        type: choice
        options:
          - off
          - on

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install foxesscloud
        run: pip install foxesscloud requests matplotlib

      - name: Run scheduler script
        env:
          FOX_API_KEY: ${{ secrets.FOX_API_KEY }}
          FOX_DEVICE_SN: ${{ secrets.FOX_DEVICE_SN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scheduler.py ${{ github.event.inputs.action }}
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "11" ]; then
              python scheduler.py off
            else
              python scheduler.py on
            fi
          fi
